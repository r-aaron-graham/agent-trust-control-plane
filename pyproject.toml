[project]
name = "agent-trust-control-plane"
version = "0.1.0"
description = "Reference implementation of an AI agent control plane with policy, retrieval, evaluation, audit logging, and human review."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==7.1.0",
  "httpx==0.28.1",
  "ruff==0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]
