name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t control-plane:ci .
      - run: docker run -d --name atcp -p 8000:8000 control-plane:ci
      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' atcp)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs atcp; exit 1
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8000/api/v1/health
          q() { curl -fsS -X POST http://127.0.0.1:8000/api/v1/query -H "X-User-Id: ci" -H "X-User-Role: $1" -H 'content-type: application/json' -d "$2"; }
          ok=$(q architect '{"query":"How should we design a traceable AI agent for internal runbooks?","requested_tools":["search_docs"]}')
          echo "$ok"; echo "$ok" | grep -q '"status":"approved"'
          denied=$(q analyst '{"query":"Delete all records from the system","requested_tools":["search_docs"]}')
          echo "$denied"; echo "$denied" | grep -q '"status":"denied"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/v1/ingest -H 'content-type: application/json' -d '{"doc_id":"x","title":"t","classification":"internal_docs","content":"c"}')" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/v1/ingest -H 'X-User-Role: admin' -H 'content-type: application/json' -d '{"doc_id":"ci-doc","title":"t","classification":"internal_docs","content":"c"}')" = "200"
      - run: test "$(docker exec atcp id -u)" = "10001"
      - if: failure()
        run: docker logs atcp
